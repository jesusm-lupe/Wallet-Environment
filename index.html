<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUPE Digital Membership</title>
  
  <!-- Import LUPE's official font -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Permanent+Marker:400,400i&subset=latin,latin-ext&display=auto" type="text/css" media="all">
  
  <style>
    :root {
      --lupe-blue: #033E8C;
      --lupe-dark-blue: #02285a;
      --lupe-gold: #F2B705;
      --lupe-red: #E31837;
      --text-dark: #202020;
    }
    
    body {
      font-family: Helvetica, Arial, sans-serif;
      color: var(--text-dark);
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      background-image: url('https://lupenet.org/wp-content/uploads/2021/01/IMG_1162-bw.png');
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      background-attachment: fixed;
    }

    /* LUPE's signature blue overlay */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(3, 62, 140, 0.90);
      z-index: 0;
    }

    .header-text {
      position: relative;
      z-index: 1;
      font-family: 'Permanent Marker', handwriting;
      font-size: 3em;
      color: var(--lupe-gold);
      margin-bottom: 20px;
      text-align: center;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.97);
      padding: 40px 30px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      text-align: center;
      max-width: 420px;
      width: 90%;
      border-top: 6px solid var(--lupe-gold);
    }

    .logo {
      max-width: 140px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 10px;
      color: var(--lupe-blue);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    p {
      font-size: 15px;
      color: #555;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      margin-bottom: 15px;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--lupe-blue);
      box-shadow: 0 0 5px rgba(3, 62, 140, 0.3);
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: var(--lupe-blue);
      color: white;
      border: none;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
      /* LUPE's signature 3D button shadow */
      box-shadow: 0 0.25em 0 0 var(--lupe-dark-blue), 0 4px 9px rgba(0,0,0,0.3);
      transition: all 0.2s ease-in-out;
      margin-bottom: 10px;
    }

    button:hover {
      background: var(--lupe-dark-blue);
      transform: translateY(2px);
      box-shadow: 0 0.15em 0 0 var(--lupe-dark-blue), 0 2px 4px rgba(0,0,0,0.3);
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 0 var(--lupe-dark-blue);
    }

    #wallet-container {
      margin-top: 25px;
      min-height: 50px;
    }

    .error-msg {
      color: white;
      font-size: 14px;
      background: var(--lupe-red);
      padding: 12px;
      border-radius: 4px;
      margin-top: 15px;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div class="header-text">Join LUPE!</div>

  <div class="card">
    <img src="https://lupe.org/wp-content/uploads/logo.png" alt="LUPE Logo" class="logo">
    <h1>Digital Membership</h1>
    <p>Register below to generate your official La Unión del Pueblo Entero member card.</p>
    
    <input type="text" id="firstNameInput" placeholder="First Name" />
    <input type="text" id="lastNameInput" placeholder="Last Name" />
    <button onclick="registerAndGenerateCard()">Register & Get Wallet Pass</button>

    <div id="wallet-container"></div>
  </div>

  <script>
    async function registerAndGenerateCard() {
      const firstName = document.getElementById('firstNameInput').value.trim();
      const lastName = document.getElementById('lastNameInput').value.trim();
      const container = document.getElementById('wallet-container');
      
      if (!firstName || !lastName) {
        container.innerHTML = `<div class="error-msg">Please enter both your first and last name.</div>`;
        return;
      }

      container.innerHTML = "<p style='color:#555; font-weight: bold;'>Registering your membership... please wait.</p>";

      try {
        const response = await fetch('/api/register-wallet', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ firstName: firstName, lastName: lastName })
        });

        const data = await response.json();

        if (response.ok && data.saveUrl) {
          container.innerHTML = `
            <a href="${data.saveUrl}" target="_blank" style="display:inline-block; margin-top:10px;">
              <img src="https://developers.google.com/static/wallet/tickets/images/add-to-google-wallet-button.png" 
                   alt="Add to Google Wallet" height="48">
            </a>
          `;
        } else {
          container.innerHTML = `<div class="error-msg">${data.error || "Failed to generate pass."}</div>`;
        }
      } catch (error) {
        console.error(error);
        container.innerHTML = `<div class="error-msg">A network error occurred. Is the database running?</div>`;
      }
    }
  </script>
</body>
</html>
